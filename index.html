<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Lovely Girl</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="book" id="book">
        <div class="leaf" style="z-index: 1;">
            <div class="front">
                <div class="page-content">
                    <img src="isla3.jpg" alt="Foto 3">
                    <p>I like you a lot. Like… a LOT lot.</p>
                    <div class="page-number">3</div>
                </div>
            </div>
            <div class="back"></div>
        </div>
        <div class="leaf" id="leaf2" style="z-index: 2;">
            <div class="front">
                <div class="page-content">
                    <img src="isla2.jpg" alt="Foto 2">
                    <p>I still don’t understand how you can be this cute and still act like it’s normal. Lol.</p>
                    <div class="page-number">2</div>
                </div>
            </div>
            <div class="back"></div>
        </div>
        <div class="leaf" id="leaf1" style="z-index: 3;">
            <div class="front">
                <div class="page-content">
                    <img src="isla1.jpg" alt="Foto 1">
                    <p>Looking at you too long may cause excessive smiling and sudden feelings of love.</p>
                    <div class="page-number">1</div>
                </div>
            </div>
            <div class="back"></div>
        </div>
        <div class="leaf cover-leaf" id="cover" style="z-index: 4;">
            <div class="front">
                <div class="scribble s1">💧</div>
                <div class="scribble s2">🪷</div>
                <img src="profile.jpg" alt="Profile" class="profile-pic">
                <div class="lotus-gold"></div>
                <h1>Pretty Snaps of<br>My Girlfriend</h1>
                <p style="margin-top: 30px; font-size: 0.8rem; opacity: 0.6;">@islasie</p>
            </div>
            <div class="back">
                <div style="color: rgba(255,255,255,0.05); font-size: 5rem; display: flex; align-items: center; justify-content: center; height: 100%;">🪽</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
